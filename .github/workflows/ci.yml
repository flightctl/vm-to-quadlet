name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Unit tests
        run: make test

      - name: Lint
        run: make lint

  integration-tests:
    name: Integration tests (Quadlet validation)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Docker is pre-installed on GitHub Actions runners, which is required
      # by testcontainers-go to spin up Podman containers for validation.
      - name: Verify Docker is available
        run: docker info

      - name: Run integration tests
        run: go test -v -count=1 -timeout=30m -tags=integration ./test/integration/
